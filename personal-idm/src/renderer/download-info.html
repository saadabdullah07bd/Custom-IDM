<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download File Info</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .custom-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 10px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      -webkit-app-region: drag;
    }
    .titlebar-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .titlebar-controls {
      display: flex;
      align-items: center;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 24px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
    }
    .titlebar-btn:hover {
      background: var(--table-row-hover);
      color: var(--text-primary);
    }
    .titlebar-btn.close:hover {
      background: var(--color-danger);
      color: #ffffff;
    }
    .info-container {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: calc(100vh - 32px);
      box-sizing: border-box;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .info-label {
      width: 65px;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      flex-shrink: 0;
      text-align: right;
    }
    .info-field-wrap {
      flex: 1;
      display: flex;
      gap: 6px;
    }
    .size-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      margin-left: 75px;
    }
    .size-icon {
      color: var(--accent-color);
    }
    .size-text {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }
    .button-bar {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Custom Frameless Titlebar -->
  <div class="custom-titlebar">
    <div class="titlebar-text">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Download File Info</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn close" id="btnTitleClose" title="Cancel & Close">✕</button>
    </div>
  </div>

  <div class="info-container">
    <!-- URL -->
    <div class="info-row">
      <span class="info-label">URL:</span>
      <div class="info-field-wrap">
        <input type="text" id="infoUrl" class="win-input" readonly style="font-size: 11.5px; opacity: 0.85;" />
      </div>
    </div>

    <!-- Category -->
    <div class="info-row">
      <span class="info-label">Category:</span>
      <div class="info-field-wrap">
        <select id="infoCategory" class="win-select" style="width: 140px;">
          <option value="compressed">Compressed</option>
          <option value="documents">Documents</option>
          <option value="music">Music</option>
          <option value="programs">Programs</option>
          <option value="video" selected>Video</option>
          <option value="general">General</option>
        </select>
      </div>
    </div>

    <!-- Save As -->
    <div class="info-row">
      <span class="info-label">Save As:</span>
      <div class="info-field-wrap">
        <input type="text" id="infoSavePath" class="win-input" />
        <button class="win-btn win-btn-sm" id="btnBrowseSave">...</button>
      </div>
    </div>

    <!-- Detected Size Banner -->
    <div class="size-box">
      <div class="size-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </div>
      <div>
        <div style="font-size: 10.5px; color: var(--text-muted);">Payload Size:</div>
        <div class="size-text" id="infoSizeText">Probing...</div>
      </div>
    </div>

    <!-- Description -->
    <div class="info-row" style="align-items: flex-start;">
      <span class="info-label" style="margin-top: 4px;">Description:</span>
      <div class="info-field-wrap">
        <input type="text" id="infoDescription" class="win-input" placeholder="File download request" />
      </div>
    </div>

    <!-- Action Buttons matching IDM -->
    <div class="button-bar">
      <button class="win-btn win-btn-accent" id="btnStartDownload">Start Download</button>
      <button class="win-btn" id="btnCancel">Cancel</button>
    </div>
  </div>

  <script src="download-info.js"></script>
</body>
</html>
